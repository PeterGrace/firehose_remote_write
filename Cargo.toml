[package]
name = "firehose_remote_write"
version = "0.8.2"
edition = "2021"

[dependencies]
axum = { version = "0.7.5", features = ["http2", "macros","tokio"] }
tracing = {version = "0.1.40"}
tracing-subscriber = {version = "0.3.17", features = ["fmt","env-filter"]}
tracing-log = "0.2.0"
serde = {version = "1.0.154", features=["derive"]}
serde_json = "1.0.94"
serde_yaml = "0.9.34"
# `time` is declared explicitly because `writer::push_with_retry` calls `tokio::time::sleep`
# in production code. It was already reaching the build transitively via axum, which is not
# something a crate should depend on for an API it uses directly.
tokio = { version = "1.37.0", features=["macros","rt-multi-thread","time"] }
lazy_static = "1.4.0"
anyhow = "1.0.86"
url = "2.5.0"
reqwest = { version = "0.12.4", default_features = false, features = ["rustls-tls"] }
strum = { version = "0.26.2", features = ["derive", "strum_macros"] }
prometheus = { git = "https://github.com/PeterGrace/rust-prometheus" }
prometheus_remote_write ={ git = "https://github.com/PeterGrace/prom-write.git" }
base64 = "0.22.1"
convert_case = "0.6.0"
aws-sdk-cloudwatch = "1.98.0"
aws-arn = "0.3.1"
aws-config = "1.8.11"
cached = { version = "0.56.0", features = ["async_tokio_rt_multi_thread"] }
aws-smithy-types = "1.3.4"
# Two features, each closing a way this endpoint silently loses data -- see the notes on
# `MAX_BODY_BYTES` and `app_with_body_limit` in `main.rs`. `decompression-gzip` decodes the
# bodies a delivery stream with compression enabled sends; `map-request-body` is what lets
# the decompression layer's output typecheck against axum's `Route`. 0.5 is the line that
# pairs with axum 0.7 (both on http 1.x).
tower-http = { version = "0.5", features = ["decompression-gzip", "map-request-body"] }

[dev-dependencies]
# `test-util` gives the retry tests `#[tokio::test(start_paused = true)]`: a virtual clock the
# runtime auto-advances when it goes idle. Without it, asserting on the backoff schedule means
# asserting that wall-clock elapsed landed inside a window, which is a probabilistic detector
# on a loaded CI box -- and the schedule is the only thing watching several of these mutants.
# Under resolver 2 a dev-dependency feature does not reach the release binary.
tokio = { version = "1.37.0", features = ["test-util"] }
aws-smithy-runtime = { version = "1.9.4", features = ["client", "test-util"] }
aws-credential-types = { version = "1", features = ["test-util"] }
http = "1.1"
# `every_received_batch_reaches_the_payload` decodes the bytes the writer actually pushed,
# rather than asserting on the `WriteRequest` it built. Those are different claims: the
# encode step sits between them and is where "the body is snappy-compressed protobuf" is
# either true or silently not. Both versions match what `prometheus_remote_write` already
# resolves to in Cargo.lock, so this pulls nothing new into the build.
prost = "0.12"
snap = "1.1"
# `ServiceExt::oneshot`, so the handler tests drive the real `Router` -- layers included --
# rather than calling `get_firehose` directly. That distinction is load-bearing: the body
# limit and the gzip decoding live in the layers, so a test that called the function would
# pass with both deleted. 0.4 matches the tower axum 0.7 itself depends on.
tower = { version = "0.4", features = ["util"] }
# Builds the gzip bodies for the decompression tests. Already in the tree via tower-http's
# async-compression, so this pulls nothing new into the build.
flate2 = "1.1.9"
